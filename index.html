<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>그림셈 DrawCalc</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{--bg:#F6F8FB;--sf:#fff;--ink:#1E2533;--t2:#5B6478;--line:#E3E8F0;--pri:#2F6BFF;--acc:#FFC933}
@media (prefers-color-scheme:dark){:root{--bg:#12161F;--sf:#1B2130;--ink:#E8ECF4;--t2:#A3ACBD;--line:#2C3446;--pri:#7FA3FF}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{width:min(520px,100%);padding:40px 28px;text-align:center;background:var(--sf);border:1px solid var(--line);border-radius:20px}
.mark{display:block;width:120px;height:120px;margin:0 auto 20px}
h1{margin:0 0 8px;font-size:26px;line-height:1.35}
p{margin:0 0 6px;font-size:17px}
.en{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);color:var(--t2)}
.en p{font-size:15px}
a{color:var(--pri)}
.foot{margin-top:24px;font-size:13px;color:var(--t2)}
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.png" width="120" height="120" alt="그림셈 DrawCalc">
  <h1>그림셈은 지금 수정 중입니다</h1>
  <p>더 좋은 모습으로 곧 다시 찾아오겠습니다.</p>
  <p>기다려 주셔서 고맙습니다.</p>
  <div class="en">
    <p><strong>DrawCalc is being updated.</strong></p>
    <p>We will be back soon. Thank you for waiting.</p>
  </div>
  <p class="foot"><a href="privacy.html">개인정보처리방침 · Privacy Policy</a></p>
</main>
</body>
</html>
